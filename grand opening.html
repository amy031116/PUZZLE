<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 카카오톡/네이버 등 앱 내 브라우저(안드로이드+아이폰)일 때만 inapp 클래스 추가 (크롬/삼성/사파리 등 일반 브라우저는 영향 없음)
      if (/KAKAOTALK|NAVER|; wv\)/i.test(navigator.userAgent)) {
        document.documentElement.classList.add("inapp");
      }
    </script>
    <!-- 항상 최신 버전을 불러오도록 브라우저 캐시(임시저장) 방지 -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Grand Opening – PUZZLE</title>
    <link rel="preload" href="그랜드오프닝/배경_넓게.webp" as="image" />
    <link
      rel="preload"
      href="그랜드오프닝/그랜드 오프닝 타이틀.png"
      as="image"
    />
    <link
      rel="preload"
      href="fonts/Paperlogy-4Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/Paperlogy-7Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Paperlogy 폰트 (사이트 내부 파일 사용 – 앱 브라우저에서도 동일하게 표시) */
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-4Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-5Medium.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-6SemiBold.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-7Bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-8ExtraBold.woff2") format("woff2");
        font-weight: 800;
        font-display: block;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 카카오톡/네이버 등 앱 브라우저의 글자 크기 자동 보정 끄기 */
        -webkit-text-size-adjust: none;
        -moz-text-size-adjust: none;
        text-size-adjust: none;
      }

      /* 레이어 컨테이너 – 화면 전체 채움 */
      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
      }

      /* 핵심 UI 요소가 담기는 캔버스 (비율 유지하며 화면 안에 모두 보이게 맞춤 - Safe Zone) */
      .content-wrapper {
        position: absolute;
        left: 50%;
        top: 50%; /* 웹 기본: 정중앙 */
        transform: translate(-50%, -50%) scale(1); /* 웹 기본: 원본 크기 */
        width: 100vw;
        height: 100vh;
        max-width: calc(100vh * 16 / 9);
        max-height: calc(100vw * 9 / 16);
        container-type: inline-size;
        z-index: 3;
      }

      /* 애니메이션 키프레임 */
      @keyframes starPulse {
        0%,
        100% {
          transform: scale(1.1) translateZ(0); /* 웹 기본 */
        }
        50% {
          transform: scale(1.15) translateZ(0); /* 웹 기본 */
        }
      }
      @keyframes starPulseMobile {
        0%,
        100% {
          transform: scale(1.43) translateZ(0); /* 모바일: 1.3배 */
        }
        50% {
          transform: scale(1.495) translateZ(0); /* 모바일: 1.3배 */
        }
      }

      @keyframes titleFloat {
        0%,
        100% {
          transform: translateY(0px) translateZ(0);
        }
        50% {
          transform: translateY(-3px) translateZ(0);
        }
      }

      /* 공통 레이어 스타일 */
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain; /* cover에서 contain으로 변경하여 이미지 잘림 방지 */
        /* 하드웨어 가속 강제 적용 (리페인트 억제) */
        transform: translateZ(0);
      }

      /* 레이어 순서 */
      .layer-bg {
        z-index: 1;
        object-fit: cover; /* 배경은 잘리더라도 화면을 꽉 채움 */
      }
      .layer-star {
        z-index: 2;
        animation: starPulse 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        transform-origin: center center;
        object-fit: cover; /* 별도 잘리더라도 화면을 꽉 채움 */
        object-position: center center; /* 웹 기본 */
        will-change: transform; /* 애니메이션이 있는 요소에만 적용 */
      }
      .layer-puzzle {
        z-index: 3;
        top: calc(20 / 1080 * 100%); /* 웹 기본 */
        transform: translateZ(0) scale(0.5); /* 원본 스케일 복구 */
      }
      .layer-title {
        z-index: 4;
        top: calc(50 / 1080 * 100%); /* 웹 기본 */
        transform: translateZ(0) scale(0.9); /* 원본 스케일 복구 */
        transform-origin: top center;
      }

      /* 텍스트 블록 */
      .info-text {
        position: absolute;
        bottom: calc(
          7% + (7 / 1080 * 100%) + 18px
            /* 웹 기본: 위로 5px 올림 (15px + 3px) */
        );
        left: 50%;
        /* 글자를 4배 크게 배치한 뒤 1/4로 축소 (앱 브라우저의 최소 글자 크기 제한 회피): 0.77 / 4 = 0.1925 */
        font-size: 64px; /* 4배 기준 (기존 16px × 4) */
        transform: translateX(-50%) scale(0.1925);
        transform-origin: bottom center;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        white-space: nowrap;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        line-height: 1.25;
      }
      .info-date {
        font-weight: 700;
        font-size: 3.01cqi; /* 2.74에서 1.1배 확대 */
        display: block;
        margin-bottom: -5px; /* 첫째 줄과 둘째 줄 사이 간격 3px 축소 */
      }
      .info-venue {
        font-weight: 700;
        font-size: 14.24cqi; /* 3.56cqi × 4 */
        display: block;
        text-align-last: justify;
        text-align: justify;
        padding: 0 0.5em; /* 양쪽 글자가 너무 퍼지지 않게 안으로 모아줌 */
      }
      .info-label {
        font-weight: 600;
        font-size: 6.84cqi; /* 1.71cqi × 4 */
        width: 4em;
      }
      .opening-label {
        letter-spacing: 0.4em;
      }
      .info-period-wrapper {
        display: flex;
        flex-direction: column;
        align-self: center;
        margin-top: 0.4em; /* 웹 기본 */
        width: max-content;
      }
      .info-period-group {
        display: flex;
        justify-content: flex-start;
        gap: calc(0.2em + 32px); /* 웹 기본: 8px × 4 */
        align-items: center;
        width: 100%;
      }
      .info-period-group + .info-period-group {
        margin-top: 0.1em; /* 웹 기본 */
      }
      .info-period {
        font-weight: 400;
        font-size: 6.84cqi; /* 1.71cqi × 4 */
        display: flex;
        justify-content: space-between;
        flex: 1;
      }

      /* D-Day 타이머 - 외부(위치), 내부(애니메이션) 분리 */
      .dday-outer {
        position: absolute;
        top: calc(6% + (10 / 1080 * 100%)); /* 웹 기본 */
        left: 50%;
        transform: translateX(-50%) scale(0.9); /* 원본 스케일 복구 */
        transform-origin: top center;
        z-index: 10;
        pointer-events: none;
      }
      .dday-wrap {
        text-align: center;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        white-space: nowrap;
      }
      .dday-number {
        display: block;
        font-size: 3.48cqi; /* 63px 기준 반응형 (기존대비 5px 큼) */
        font-weight: 800;
        letter-spacing: -0.1cqi;
        line-height: 1;
      }
      /* 숨겨진 관리자 버튼 */
      .admin-bypass {
        position: absolute;
        top: calc(15 / 1080 * 100%);
        right: calc(527 / 1920 * 100%);
        width: 36px;
        height: 36px;
        z-index: 99;
        cursor: pointer;
        opacity: 0; /* 평소에는 안 보이게 투명처리 */
        font-size: 20px;
        line-height: 36px;
        text-align: center;
        user-select: none;
        transition: opacity 0.2s;
      }
      .admin-bypass:active {
        opacity: 0.5;
      }

      /* =========================================================
         태블릿 전용 레이아웃 (아이패드 등에서 텍스트 위치 미세 조정)
         ========================================================= */
      @media (min-width: 601px) and (max-width: 1024px) {
        .info-text {
          bottom: 6%; /* 기존 약 8% 위치에서 아래로 약간 내림 */
        }
      }

      /* =========================================================
         모바일 전용 레이아웃 (지금까지 수정한 2.3배 확대 및 픽셀 보정)
         ========================================================= */
      @media (max-width: 600px) {
        .content-wrapper {
          top: 50%;
          transform: translate(-50%, -50%) scale(2.3);
        }
        /* 앱 브라우저(카톡 등): 크롬/삼성인터넷과 동일한 화면 높이(가로폭의 약 1.965배)로 계산 */
        html.inapp .scene {
          height: max(100vh, calc(100vw * 1.965));
        }
        .layer-star {
          animation: starPulseMobile 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
          object-position: center calc(50% - 15px);
        }
        .layer-puzzle {
          top: calc(20 / 1080 * 100% - 10px);
        }
        .layer-title {
          top: calc(50 / 1080 * 100% - 10px);
        }
        .info-text {
          bottom: calc(
            7% + (7 / 1080 * 100%) + 13px
          ); /* 모바일: 아래로 3px 내림 (15px - 3px) */
        }
        .info-period-wrapper {
          margin-top: calc(0.4em - 16px); /* -4px × 4 */
        }
        .info-period-group {
          gap: 0.2em; /* 모바일은 기존 좁은 간격 유지 */
        }
        .info-period-group + .info-period-group {
          margin-top: calc(0.1em - 4px); /* -1px × 4 */
        }
        .dday-outer {
          top: calc(6% + (10 / 1080 * 100%) - 10px);
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <!-- 1. 배경 (화면 전체 꽉 채우기) -->
      <img
        class="layer layer-bg"
        src="그랜드오프닝/배경_넓게.webp"
        alt="배경"
        decoding="async"
        fetchpriority="high"
      />
      <!-- 2. 별 (화면 전체 꽉 채우기) -->
      <img
        class="layer layer-star"
        src="그랜드오프닝/별_넓게.webp"
        alt="별"
        decoding="async"
      />

      <div class="content-wrapper">
        <!-- 3. 퍼즐 (안전 영역) -->
        <img
          class="layer layer-puzzle"
          src="그랜드오프닝/퍼즐_lossy0.webp"
          alt="퍼즐"
          decoding="async"
        />
        <!-- 4. 타이틀 -->
        <img
          class="layer layer-title"
          src="그랜드오프닝/그랜드 오프닝 타이틀.png"
          alt="그랜드 오프닝 타이틀"
          decoding="async"
        />
        <div class="info-text">
          <span class="info-venue">강남 모나코 스페이스</span>
          <div class="info-period-wrapper">
            <div class="info-period-group">
              <span class="info-label opening-label">오프닝</span>
              <span class="info-period">
                <span>2026.11.05</span>
                <span>06:00 PM</span>
              </span>
            </div>
            <div class="info-period-group">
              <span class="info-label">전시기간</span>
              <span class="info-period">
                <span>2026.11.05</span>
                <span>~ 2026.11.09</span>
              </span>
            </div>
          </div>
        </div>
        <!-- 6. D-Day 타이머 -->
        <div class="dday-outer">
          <div class="dday-wrap">
            <span class="dday-number" id="ddayNum">D-??</span>
          </div>
        </div>
        <!-- 7. 숨겨진 관리자 버튼 (좌하단, 3번 클릭 시 메인으로) -->
        <div class="admin-bypass" id="adminBtn">🧩</div>
      </div>
    </div>

    <script>
      const target = new Date("2026-11-05T18:00:00+09:00");

      function update() {
        const now = new Date();
        const diff = target - now;

        if (diff <= 0) {
          document.getElementById("ddayNum").textContent = "D-DAY";
          // D-Day 도달 시 3초 후 자동으로 메인으로 이동
          setTimeout(function () {
            location.replace("main.html");
          }, 3000);
          return;
        }

        const days = Math.floor(diff / 86400000);
        document.getElementById("ddayNum").textContent = "D-" + days;
      }

      update();
      setInterval(update, 1000);

      // 숨겨진 관리자 바이패스: 좌하단 3번 연속 클릭
      let clickCount = 0;
      let clickTimer = null;
      document
        .getElementById("adminBtn")
        .addEventListener("click", function () {
          clickCount++;
          clearTimeout(clickTimer);
          if (clickCount >= 3) {
            clickCount = 0;
            sessionStorage.setItem("adminBypass", "true"); // 가드 무력화 플래그
            location.href = "main.html";
          }
          clickTimer = setTimeout(function () {
            clickCount = 0;
          }, 2000);
        });
    </script>
  </body>
</html>
