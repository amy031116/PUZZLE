<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 카카오톡/네이버 등 앱 내 브라우저(안드로이드+아이폰)일 때만 inapp 클래스 추가 (크롬/삼성/사파리 등 일반 브라우저는 영향 없음)
      if (/KAKAOTALK|NAVER|; wv\)/i.test(navigator.userAgent)) {
        document.documentElement.classList.add("inapp");
      }
      // URL에 ?admin=true 또는 ?bypass 가 있으면 관리자 인증 저장 후 메인으로 자동 이동
      if (
        location.search.indexOf("admin") !== -1 ||
        location.search.indexOf("bypass") !== -1
      ) {
        try {
          localStorage.setItem("adminBypass", "true");
        } catch (e) {}
        location.replace("main.html");
      }

      // 화면 크기(PC, 태블릿, 모바일)에 상관없이 덜컥거림 없이 부드럽게 비율을 유지하는 연속 스케일 계산
      function updateContentScale() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const aspect = w / h;

        // 1. 높이 기준 기본 스케일 (가로 화면에서도 상하 텍스트가 별 안쪽에 여유있고 완벽하게 들어가도록 0.79 비율 적용)
        let scaleH = (h / 1080) * 0.79;
        if (aspect < 1.0) {
          // 세로 화면(모바일/세로 태블릿)에서는 별 안쪽 영역에 맞추어 상하 여백을 확보
          const portraitFactor = 0.75 + 0.25 * Math.min(1, Math.max(0, aspect));
          scaleH = (h / 1080) * portraitFactor;
        }

        // 2. 너비 기준 스케일 (핵심 콘텐츠가 화면 좌우를 벗어나지 않도록 자연스럽게 축소)
        const scaleW = (w * 0.94) / 600;

        // 화면 높이와 너비 제약 중 더 작은 쪽에 맞춤 (화면 좌우를 줄여도 덜컥거림 없이 매끄럽게 반응)
        let scale = Math.min(scaleH, scaleW);

        // 3. 별 스케일 (화면을 전체화면으로 키워도 아래가 잘리지 않고, 꼭짓점이 화면 안에 온전히 들어가도록 보정)
        const imageAR = 3840 / 4132; // 약 0.9293
        const baseHeight = Math.min(h, w / imageAR);

        // 가로 화면에서는 약 1.20배로 별의 아래쪽 꼭짓점이 화면 하단에 닿거나 잘리지 않고 온전하게 쏙 들어감
        // 창 폭을 줄이거나 늘려도(PC 가로 화면) 별의 크기가 변하지 않고 안정적으로 유지됨
        const t = Math.min(1, Math.max(0, (aspect - 0.5) / (1.2 - 0.5)));
        const targetRatio = 1.8 - 0.6 * t; // 모바일(1.80) -> PC(1.20)
        const desiredHeight = h * targetRatio;

        const starMin = (desiredHeight / baseHeight) * 1.3; // 별 자체의 기본 크기를 1.1배 확대
        const starMax = starMin * 1.035; // 숨쉬는 듯한 자연스러운 미세 펄스 유지

        document.documentElement.style.setProperty("--content-scale", scale);
        document.documentElement.style.setProperty("--star-scale-min", starMin);
        document.documentElement.style.setProperty("--star-scale-max", starMax);
      }
      updateContentScale();
      window.addEventListener("resize", updateContentScale);
      window.addEventListener("orientationchange", updateContentScale);
    </script>
    <!-- 항상 최신 버전을 불러오도록 브라우저 캐시(임시저장) 방지 -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Grand Opening – PUZZLE</title>
    <link
      rel="preload"
      href="웹 에셋/전시타이틀.svg"
      as="image"
      type="image/svg+xml"
    />
    <link
      rel="preload"
      href="그랜드오프닝/배경_넓게.webp"
      as="image"
    />
    <link
      rel="preload"
      href="fonts/Paperlogy-4Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/Paperlogy-7Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Paperlogy 폰트 (사이트 내부 파일 사용 – 앱 브라우저에서도 동일하게 표시) */
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-4Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-5Medium.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-6SemiBold.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-7Bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("fonts/Paperlogy-8ExtraBold.woff2") format("woff2");
        font-weight: 800;
        font-display: block;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 카카오톡/네이버 등 앱 브라우저의 글자 크기 자동 보정 끄기 */
        -webkit-text-size-adjust: none;
        -moz-text-size-adjust: none;
        text-size-adjust: none;
      }

      /* 레이어 컨테이너 – 화면 전체 채움 */
      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #ff2b85;
      }

      /* 핵심 UI 요소가 담기는 캔버스 (1920x1080 원본 비율을 완벽하게 유지하며 모든 화면에서 동일하게 스케일링) */
      .content-wrapper {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1920px;
        height: 1080px;
        transform: translate(-50%, -50%) scale(var(--content-scale, 1));
        transform-origin: center center;
        container-type: inline-size;
        z-index: 3;
        pointer-events: none;
      }

      /* 애니메이션 키프레임 */
      @keyframes starPulse {
        0%,
        100% {
          transform: scale(var(--star-scale-min, 1.1)) translateZ(0);
        }
        50% {
          transform: scale(var(--star-scale-max, 1.15)) translateZ(0);
        }
      }

      /* 공통 레이어 스타일 */
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain; /* cover에서 contain으로 변경하여 이미지 잘림 방지 */
        /* 하드웨어 가속 강제 적용 (리페인트 억제) */
        transform: translateZ(0);
      }

      /* 레이어 순서 */
      .layer-bg {
        z-index: 1;
        object-fit: cover;
        object-position: center center;
      }
      .layer-star {
        z-index: 2;
        animation: starPulse 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        transform-origin: center center;
        object-fit: contain; /* 잘림 없이 전체 꼭짓점이 화면 안에 온전히 표시되도록 contain 적용 */
        object-position: center center;
        will-change: transform;
      }
      .layer-puzzle {
        z-index: 3;
        top: calc(-21 / 1080 * 100%); /* 아래로 20px 이동 (-41px -> -21px) */
        transform: translateZ(0) scale(0.384); /* 1px 사이즈 축소 */
      }

      /* 전시 타이틀 SVG (상단 PUZZLE 로고 - 1px 사이즈 축소) */
      .exhibition-title {
        position: absolute;
        top: calc(
          10% + (5 / 1080 * 100%)
        ); /* 아래로 20px 이동 (-20px -> 0px) */
        left: 50%;
        transform: translateX(-50%);
        width: calc(16.65cqi + 2px); /* 1px 축소 */
        max-width: 344px;
        height: auto;
        z-index: 10;
        pointer-events: none;
      }

      /* 텍스트 블록 (타이머 밑 하단글 - 1px 축소) */
      .info-text {
        position: absolute;
        top: calc(
          25.5% + (10 / 1080 * 100%) - 30px
        ); /* 아래로 20px 이동 (-50px -> -30px) */
        left: 50%;
        /* 글자를 4배 크게 배치한 뒤 1/4로 축소 (앱 브라우저의 최소 글자 크기 제한 회피) */
        font-size: 64px; /* 4배 기준 (기존 16px × 4) */
        transform: translateX(-50%) scale(0.146); /* 1px 축소 (기존 0.154 -> 0.146) */
        transform-origin: top center;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        white-space: nowrap;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        line-height: 1.25;
      }
      .info-date {
        font-weight: 700;
        font-size: 3.01cqi; /* 2.74에서 1.1배 확대 */
        display: block;
        margin-bottom: -5px; /* 첫째 줄과 둘째 줄 사이 간격 3px 축소 */
      }
      .info-label {
        font-weight: 600;
        font-size: 6.84cqi; /* 1.71cqi × 4 */
        width: 4em;
      }
      .opening-label {
        letter-spacing: 0.4em;
      }
      .info-period-wrapper {
        display: flex;
        flex-direction: column;
        align-self: center;
        margin-top: 0; /* 강남 모나코 스페이스가 있던 최상단 위치로 바로 올림 */
        width: max-content;
      }
      .info-period-group {
        display: flex;
        justify-content: flex-start;
        gap: calc(0.2em + 32px); /* 웹 기본: 8px × 4 */
        align-items: center;
        width: 100%;
      }
      .info-period-group + .info-period-group {
        margin-top: 0.1em; /* 웹 기본 */
      }
      .info-period {
        font-weight: 400;
        font-size: 6.84cqi; /* 1.71cqi × 4 */
        display: flex;
        justify-content: space-between;
        flex: 1;
      }

      /* D-Day 타이머 (아래로 20px 이동: -38px -> -18px) */
      .dday-outer {
        position: absolute;
        top: calc(18% + (10 / 1080 * 100%) - 18px); /* 아래로 20px 이동 */
        left: 50%;
        transform: translateX(-50%) scale(0.9); /* 원본 스케일 복구 */
        transform-origin: top center;
        z-index: 10;
        pointer-events: none;
      }
      .dday-wrap {
        text-align: center;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        white-space: nowrap;
      }
      .dday-number {
        display: block;
        font-size: calc(3.48cqi - 1px); /* 1px 축소 */
        font-weight: 800;
        letter-spacing: -0.1cqi;
        line-height: 1;
      }

      /* 하단 소개 글 (아래로 20px 이동: -80px -> -60px) */
      .bottom-desc {
        position: absolute;
        top: calc(73.8% - 60px); /* 아래로 20px 이동 (-80px -> -60px) */
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 900px;
        text-align: center;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        font-size: 1.05cqi; /* 오프닝 글과 동일한 폰트 사이즈 (6.84cqi × 0.154) */
        font-weight: 500;
        line-height: 1.65;
        z-index: 10;
        pointer-events: none;
      }
      .bottom-desc-p + .bottom-desc-p {
        margin-top: 0.55em;
      }
      .bottom-venue {
        margin-top: 1.25em;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35em;
      }
      .bottom-venue-name {
        font-weight: 700;
        font-size: 1.3cqi;
        line-height: 1.25;
      }
      .bottom-venue-address {
        font-weight: 400;
        font-size: 1.05cqi; /* 날짜와 동일한 폰트, 크기, 두께 */
        line-height: 1.25;
      }
      /* 숨겨진 관리자 버튼 */
      .admin-bypass {
        position: absolute;
        top: calc(15 / 1080 * 100%);
        right: calc(527 / 1920 * 100%);
        width: 36px;
        height: 36px;
        z-index: 99;
        cursor: pointer;
        opacity: 0; /* 평소에는 안 보이게 투명처리 */
        font-size: 20px;
        line-height: 36px;
        text-align: center;
        user-select: none;
        pointer-events: auto;
        transition: opacity 0.2s;
      }
      .admin-bypass:active {
        opacity: 0.5;
      }

      /* 앱 브라우저(카톡/네이버 등) 전용 높이 보정 */
      @media (max-width: 600px) {
        html.inapp .scene {
          height: max(100vh, calc(100vw * 1.965));
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <!-- 1. 배경 (화면 전체 꽉 채우기) -->
      <img
        class="layer layer-bg"
        src="그랜드오프닝/배경_넓게.webp"
        alt="배경"
        decoding="async"
        fetchpriority="high"
      />
      <!-- 2. 별 (화면 전체 꽉 채우기) -->
      <img
        class="layer layer-star"
        src="그랜드오프닝/별_넓게_그림자x.webp"
        alt="별"
        decoding="async"
      />

      <div class="content-wrapper">
        <!-- 3. 전시 타이틀 SVG (최상단) -->
        <img
          class="exhibition-title"
          src="웹 에셋/전시타이틀.svg"
          alt="전시 타이틀"
          decoding="async"
        />

        <!-- 4. 퍼즐 (안전 영역) -->
        <img
          class="layer layer-puzzle"
          src="그랜드오프닝/퍼즐_lossy0.webp"
          alt="퍼즐"
          decoding="async"
        />

        <div class="info-text">
          <div class="info-period-wrapper">
            <div class="info-period-group">
              <span class="info-label opening-label">오프닝</span>
              <span class="info-period">
                <span>2026.11.05</span>
                <span>06:00 PM</span>
              </span>
            </div>
            <div class="info-period-group">
              <span class="info-label">전시기간</span>
              <span class="info-period">
                <span>2026.11.05</span>
                <span>&nbsp;~ 2026.11.09</span>
              </span>
            </div>
          </div>
        </div>
        <!-- 6. D-Day 타이머 -->
        <div class="dday-outer">
          <div class="dday-wrap">
            <span class="dday-number" id="ddayNum">D-??</span>
          </div>
        </div>

        <!-- 7. 하단 소개 글 -->
        <div class="bottom-desc">
          <p class="bottom-desc-p">
            이번 전시는 26명이 각자의 방식으로 고민하고 시도하며 완성한
            결과물입니다.<br />
            슬라이딩 퍼즐처럼 수많은 시행착오를 거쳐 완성된 다양한 형태의
            작품을<br />
            하나의 2026 PRODUCT COLLECTION으로 담았습니다.
          </p>
          <div class="bottom-venue">
            <span class="bottom-venue-name">모나코 스페이스</span>
            <span class="bottom-venue-address"
              >서울 서초구 서초대로 397 부띠크모나코 지하1층</span
            >
          </div>
        </div>

        <!-- 8. 숨겨진 관리자 버튼 (좌하단, 3번 클릭 시 메인으로) -->
        <div class="admin-bypass" id="adminBtn">🧩</div>
      </div>
    </div>

    <script>
      // 이벤트 시작 시간 (한국시간 2026년 11월 5일 18:00)
      const eventTimeKst = new Date("2026-11-05T18:00:00+09:00");

      function update() {
        const now = new Date();

        // 1. 현재 접속자의 시간을 한국 시간(KST, UTC+9)으로 변환
        const utc = now.getTime() + now.getTimezoneOffset() * 60000;
        const kstNow = new Date(utc + 9 * 3600000);

        // 2. KST 기준 오늘 자정과 목표일 자정(11월 5일) 만들기
        // (JavaScript에서 월은 0부터 시작하므로 11월은 10입니다)
        const todayDate = new Date(
          kstNow.getFullYear(),
          kstNow.getMonth(),
          kstNow.getDate(),
        );
        const targetDate = new Date(2026, 10, 5);

        // 3. 자정 기준 날짜 차이 계산
        const dayDiff = Math.floor((targetDate - todayDate) / 86400000);

        // 4. 실제 이벤트 시간이 지났는지 확인
        const timeDiff = eventTimeKst - now;

        if (timeDiff <= 0) {
          document.getElementById("ddayNum").textContent = "D-DAY";
          // 이벤트 시간(18:00) 도달 시 3초 후 자동으로 메인으로 이동
          setTimeout(function () {
            location.replace("main.html");
          }, 3000);
          return;
        }

        if (dayDiff <= 0) {
          // 날짜상으로는 11월 5일이 되었지만 아직 오후 6시 전일 때
          document.getElementById("ddayNum").textContent = "D-DAY";
        } else {
          // 그 외의 경우 (밤 12시 땡 치면 숫자가 바뀜)
          document.getElementById("ddayNum").textContent = "D-" + dayDiff;
        }
      }

      update();
      setInterval(update, 1000);

      // 숨겨진 관리자 바이패스: 좌하단 3번 연속 클릭
      let clickCount = 0;
      let clickTimer = null;
      document
        .getElementById("adminBtn")
        .addEventListener("click", function () {
          clickCount++;
          clearTimeout(clickTimer);
          if (clickCount >= 3) {
            clickCount = 0;
            sessionStorage.setItem("adminBypass", "true"); // 가드 무력화 플래그
            location.href = "main.html";
          }
          clickTimer = setTimeout(function () {
            clickCount = 0;
          }, 2000);
        });
    </script>
  </body>
</html>
