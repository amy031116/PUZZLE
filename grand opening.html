<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Opening – PUZZLE</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/team-font/paperlogy@main/css/paperlogy.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Paperlogy 폰트 */
      @font-face {
        font-family: "Paperlogy";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2")
          format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2")
          format("woff2");
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2")
          format("woff2");
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2")
          format("woff2");
        font-weight: 700;
        font-display: swap;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* 레이어 컨테이너 – 화면 전체 채움 */
      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
      }

      /* 모든 요소가 담기는 캔버스 (빈틈없이 꽉 채우기 모드) */
      .content-wrapper {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 56.25vw;
        container-type: inline-size;
      }

      /* 화면이 16:9보다 길어질 경우: 높이를 기준으로 너비를 넘치게 하여 빈틈 메움 */
      @media (max-aspect-ratio: 1920/1080) {
        .content-wrapper {
          width: 177.77vh;
          height: 100vh;
        }
      }

      /* 애니메이션 키프레임 */
      @keyframes starPulse {
        0%,
        100% {
          transform: scale(1) translateZ(0);
        }
        50% {
          transform: scale(1.05) translateZ(0);
        }
      }

      @keyframes titleFloat {
        0%,
        100% {
          transform: translateY(0px) translateZ(0);
        }
        50% {
          transform: translateY(-3px) translateZ(0);
        }
      }

      /* 공통 레이어 스타일 */
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain; /* cover에서 contain으로 변경하여 이미지 잘림 방지 */
        /* 하드웨어 가속 강제 적용 (리페인트 억제) */
        transform: translateZ(0);
        will-change: transform;
      }

      /* 레이어 순서 */
      .layer-bg {
        z-index: 1;
      }
      .layer-star {
        z-index: 2;
        animation: starPulse 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        transform-origin: center center;
      }
      .layer-puzzle {
        z-index: 3;
        top: 0.93%;
        transform: translateZ(0) scale(0.5); /* 크기 절반으로 축소 */
      }
      .layer-title {
        z-index: 4;
        top: 2.31%;
        transform: translateZ(0) scale(0.9); /* 아까보다 10%(0.1) 다시 키움! */
        transform-origin: top center; /* 늘어나거나 줄어들 때 상단 여백을 유지하며 축소 */
      }

      /* 텍스트 블록 */
      .info-text {
        position: absolute;
        bottom: 7.93%; /* 기존 7%에서 약 10px 상향 */
        left: 50%;
        /* 원래 크기에서 약 30%(0.3) 정도 줄임 */
        transform: translateX(-50%) scale(0.7);
        transform-origin: bottom center;
        z-index: 10;
        text-align: center;
        white-space: nowrap;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        line-height: 1.25;
      }
      .info-date {
        font-weight: 500;
        font-size: 2.083cqi; /* 전체 scale(0.7) 블록 고려 시 화면상 정확히 28px로 나오는 비율 */
        display: block;
      }
      .info-venue {
        font-weight: 700;
        font-size: 2.5cqi; /* 48px 기준 반응형 */
        display: block;
      }
      .info-label {
        font-weight: 600;
        font-size: 1.41cqi; /* 27px 기준 반응형 */
        display: block;
        margin-top: 0.6em;
      }
      .info-period {
        font-weight: 400;
        font-size: 1.61cqi; /* 31px 기준 반응형 */
        display: block;
      }

      /* D-Day 타이머 - 외부(위치), 내부(애니메이션) 분리 */
      .dday-outer {
        position: absolute;
        top: 6%;
        left: 50%;
        transform: translateX(-50%) scale(0.9); /* 아까보다 10%(0.1) 다시 키움! */
        transform-origin: top center;
        z-index: 10;
        pointer-events: none;
      }
      .dday-wrap {
        text-align: center;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        white-space: nowrap;
      }
      .dday-number {
        display: block;
        font-size: 3.02cqi; /* 58px 기준 반응형 */
        font-weight: 800;
        letter-spacing: -0.1cqi;
        line-height: 1;
      }
      /* 숨겨진 관리자 버튼 */
      .admin-bypass {
        position: absolute;
        top: 1.1%;
        right: 27.3%; /* 왼쪽으로 100px 이동 (40 + 100) */
        width: 1.875%;
        height: 3.333%;
        z-index: 99;
        cursor: pointer;
        opacity: 0; /* 투명도를 0으로 수정 */
        font-size: 1.04cqi;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        transition: opacity 0.2s;
      }
      .admin-bypass:active {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="content-wrapper">
        <!-- 1. 배경 -->
        <img
          class="layer layer-bg"
          src="그랜드오프닝/배경_lossy0.webp"
          alt="배경"
        />
        <!-- 2. 별 -->
        <img
          class="layer layer-star"
          src="그랜드오프닝/별_lossy0.webp"
          alt="별"
        />
        <!-- 3. 퍼즐 -->
        <img
          class="layer layer-puzzle"
          src="그랜드오프닝/퍼즐_lossy0.webp"
          alt="퍼즐"
        />
        <!-- 4. 타이틀 -->
        <img
          class="layer layer-title"
          src="그랜드오프닝/그랜드 오프닝 타이틀.png"
          alt="그랜드 오프닝 타이틀"
        />
        <!-- 5. 텍스트 -->
        <div class="info-text">
          <span class="info-date"
            >2026.11.05&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;18:00</span
          >
          <span class="info-venue">강남 모나코 스페이스</span>
          <span class="info-label">전시기간</span>
          <span class="info-period">2026.11.05 ~ 2026.11.09</span>
        </div>
        <!-- 6. D-Day 타이머 -->
        <div class="dday-outer">
          <div class="dday-wrap">
            <span class="dday-number" id="ddayNum">D-??</span>
          </div>
        </div>
        <!-- 7. 숨겨진 관리자 버튼 (좌하단, 3번 클릭 시 메인으로) -->
        <div class="admin-bypass" id="adminBtn">🧩</div>
      </div>
    </div>

    <script>
      const target = new Date("2026-11-05T18:00:00+09:00");

      function update() {
        const now = new Date();
        const diff = target - now;

        if (diff <= 0) {
          document.getElementById("ddayNum").textContent = "D-DAY";
          // D-Day 도달 시 3초 후 자동으로 메인으로 이동
          setTimeout(function () {
            location.replace("main.html");
          }, 3000);
          return;
        }

        const days = Math.floor(diff / 86400000);
        document.getElementById("ddayNum").textContent = "D-" + days;
      }

      update();
      setInterval(update, 1000);

      // 숨겨진 관리자 바이패스: 좌하단 3번 연속 클릭
      let clickCount = 0;
      let clickTimer = null;
      document
        .getElementById("adminBtn")
        .addEventListener("click", function () {
          clickCount++;
          clearTimeout(clickTimer);
          if (clickCount >= 3) {
            clickCount = 0;
            sessionStorage.setItem("adminBypass", "true"); // 가드 무력화 플래그
            location.href = "main.html";
          }
          clickTimer = setTimeout(function () {
            clickCount = 0;
          }, 2000);
        });
    </script>
  </body>
</html>
