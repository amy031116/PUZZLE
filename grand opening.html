<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 항상 최신 버전을 불러오도록 브라우저 캐시(임시저장) 방지 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Grand Opening – PUZZLE</title>
    <link rel="preload" href="그랜드오프닝/배경_넓게.webp" as="image" />
    <link
      rel="preload"
      href="그랜드오프닝/그랜드 오프닝 타이틀.png"
      as="image"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/team-font/paperlogy@main/css/paperlogy.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Paperlogy 폰트 */
      @font-face {
        font-family: "Paperlogy";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2")
          format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2")
          format("woff2");
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2")
          format("woff2");
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: "Paperlogy";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2")
          format("woff2");
        font-weight: 700;
        font-display: swap;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* 레이어 컨테이너 – 화면 전체 채움 */
      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
      }

      /* 핵심 UI 요소가 담기는 캔버스 (비율 유지하며 화면 안에 모두 보이게 맞춤 - Safe Zone) */
      .content-wrapper {
        position: absolute;
        left: 50%;
        top: calc(50% + 10px); /* 메인 요소 전체를 아래로 10px 내림 */
        transform: translate(-50%, -50%) scale(2.3); /* 요소와 여백 비율을 유지한 채 2.3배 통합 확대 */
        width: 100vw;
        height: 100vh;
        max-width: calc(100vh * 16 / 9);
        max-height: calc(100vw * 9 / 16);
        container-type: inline-size;
        z-index: 3;
      }

      /* 애니메이션 키프레임 */
      @keyframes starPulse {
        0%,
        100% {
          transform: scale(1.43) translateZ(0); /* 1.1 * 1.3배 */
        }
        50% {
          transform: scale(1.495) translateZ(0); /* 1.15 * 1.3배 */
        }
      }

      @keyframes titleFloat {
        0%,
        100% {
          transform: translateY(0px) translateZ(0);
        }
        50% {
          transform: translateY(-3px) translateZ(0);
        }
      }

      /* 공통 레이어 스타일 */
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain; /* cover에서 contain으로 변경하여 이미지 잘림 방지 */
        /* 하드웨어 가속 강제 적용 (리페인트 억제) */
        transform: translateZ(0);
      }

      /* 레이어 순서 */
      .layer-bg {
        z-index: 1;
        object-fit: cover; /* 배경은 잘리더라도 화면을 꽉 채움 */
      }
      .layer-star {
        z-index: 2;
        animation: starPulse 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        transform-origin: center center;
        object-fit: cover; /* 별도 잘리더라도 화면을 꽉 채움 */
        object-position: center center; /* 별 가로세로 중앙 정렬 */
        will-change: transform; /* 애니메이션이 있는 요소에만 적용 */
      }
      .layer-puzzle {
        z-index: 3;
        top: calc(20 / 1080 * 100% - 10px); /* 위로 10px 올림 */
        transform: translateZ(0) scale(0.5); /* 원본 스케일 복구 */
      }
      .layer-title {
        z-index: 4;
        top: calc(50 / 1080 * 100% - 10px); /* 위로 10px 올림 */
        transform: translateZ(0) scale(0.9); /* 원본 스케일 복구 */
        transform-origin: top center;
      }

      /* 텍스트 블록 */
      .info-text {
        position: absolute;
        bottom: calc(
          7% + (7 / 1080 * 100%) + 15px /* 3px 아래로 내림 (+18px -> +15px) */
        );
        left: 50%;
        transform: translateX(-50%) scale(0.77); /* 원본 스케일 복구 */
        transform-origin: bottom center;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        white-space: nowrap;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        line-height: 1.25;
      }
      .info-date {
        font-weight: 700;
        font-size: 3.01cqi; /* 2.74에서 1.1배 확대 */
        display: block;
        margin-bottom: -5px; /* 첫째 줄과 둘째 줄 사이 간격 3px 축소 */
      }
      .info-venue {
        font-weight: 700;
        font-size: 3.56cqi; /* 3.24에서 1.1배 확대 */
        display: block;
        text-align-last: justify;
        text-align: justify;
        padding: 0 0.5em; /* 양쪽 글자가 너무 퍼지지 않게 안으로 모아줌 */
      }
      .info-label {
        font-weight: 600;
        font-size: 1.71cqi; /* 옆에 있는 info-period와 크기 맞춤 */
        width: 4em;
      }
      .opening-label {
        letter-spacing: 0.4em;
      }
      .info-period {
        font-weight: 400;
        font-size: 1.71cqi; /* 31px 기준 반응형 */
      }
      .info-period-wrapper {
        align-self: center;
        margin-top: calc(0.4em - 4px); /* 오프닝 위로 2px 올림 (-2px -> -4px) */
      }
      .info-period-group {
        display: flex;
        justify-content: flex-start;
        gap: 0.2em; /* 라벨과 날짜 사이 간격을 줄여서 전체 너비를 좁힘 (원래 1.5em) */
        align-items: center;
      }
      .info-period-group + .info-period-group {
        margin-top: calc(0.1em - 1px); /* 전시기간 위치 유지 (-3px -> -1px) */
      }

      /* D-Day 타이머 - 외부(위치), 내부(애니메이션) 분리 */
      .dday-outer {
        position: absolute;
        top: calc(6% + (10 / 1080 * 100%) - 10px); /* 위로 10px 올림 */
        left: 50%;
        transform: translateX(-50%) scale(0.9); /* 원본 스케일 복구 */
        transform-origin: top center;
        z-index: 10;
        pointer-events: none;
      }
      .dday-wrap {
        text-align: center;
        font-family: "Paperlogy", sans-serif;
        color: #ff2482;
        white-space: nowrap;
      }
      .dday-number {
        display: block;
        font-size: 3.48cqi; /* 63px 기준 반응형 (기존대비 5px 큼) */
        font-weight: 800;
        letter-spacing: -0.1cqi;
        line-height: 1;
      }
      /* 숨겨진 관리자 버튼 */
      .admin-bypass {
        position: absolute;
        top: calc(15 / 1080 * 100%);
        right: calc(527 / 1920 * 100%);
        width: 36px;
        height: 36px;
        z-index: 99;
        cursor: pointer;
        opacity: 0; /* 평소에는 안 보이게 투명처리 */
        font-size: 20px;
        line-height: 36px;
        text-align: center;
        user-select: none;
        transition: opacity 0.2s;
      }
      .admin-bypass:active {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <!-- 1. 배경 (화면 전체 꽉 채우기) -->
      <img
        class="layer layer-bg"
        src="그랜드오프닝/배경_넓게.webp"
        alt="배경"
        decoding="async"
        fetchpriority="high"
      />
      <!-- 2. 별 (화면 전체 꽉 채우기) -->
      <img
        class="layer layer-star"
        src="그랜드오프닝/별_넓게.webp"
        alt="별"
        decoding="async"
      />

      <div class="content-wrapper">
        <!-- 3. 퍼즐 (안전 영역) -->
        <img
          class="layer layer-puzzle"
          src="그랜드오프닝/퍼즐_lossy0.webp"
          alt="퍼즐"
          decoding="async"
        />
        <!-- 4. 타이틀 -->
        <img
          class="layer layer-title"
          src="그랜드오프닝/그랜드 오프닝 타이틀.png"
          alt="그랜드 오프닝 타이틀"
          decoding="async"
        />
        <!-- 5. 텍스트 -->
        <div class="info-text">
          <span class="info-venue">강남 모나코 스페이스</span>
          <div class="info-period-wrapper">
            <div class="info-period-group">
              <span class="info-label opening-label">오프닝</span>
              <span class="info-period">2026.11.05&emsp;&emsp;06:00 PM</span>
            </div>
            <div class="info-period-group">
              <span class="info-label">전시기간</span>
              <span class="info-period">2026.11.05 ~ 2026.11.09</span>
            </div>
          </div>
        </div>
        <!-- 6. D-Day 타이머 -->
        <div class="dday-outer">
          <div class="dday-wrap">
            <span class="dday-number" id="ddayNum">D-??</span>
          </div>
        </div>
        <!-- 7. 숨겨진 관리자 버튼 (좌하단, 3번 클릭 시 메인으로) -->
        <div class="admin-bypass" id="adminBtn">🧩</div>
      </div>
    </div>

    <script>
      const target = new Date("2026-11-05T18:00:00+09:00");

      function update() {
        const now = new Date();
        const diff = target - now;

        if (diff <= 0) {
          document.getElementById("ddayNum").textContent = "D-DAY";
          // D-Day 도달 시 3초 후 자동으로 메인으로 이동
          setTimeout(function () {
            location.replace("main.html");
          }, 3000);
          return;
        }

        const days = Math.floor(diff / 86400000);
        document.getElementById("ddayNum").textContent = "D-" + days;
      }

      update();
      setInterval(update, 1000);

      // 숨겨진 관리자 바이패스: 좌하단 3번 연속 클릭
      let clickCount = 0;
      let clickTimer = null;
      document
        .getElementById("adminBtn")
        .addEventListener("click", function () {
          clickCount++;
          clearTimeout(clickTimer);
          if (clickCount >= 3) {
            clickCount = 0;
            sessionStorage.setItem("adminBypass", "true"); // 가드 무력화 플래그
            location.href = "main.html";
          }
          clickTimer = setTimeout(function () {
            clickCount = 0;
          }, 2000);
        });
    </script>
  </body>
</html>
